<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>쿠킹클래스 — 동작 테스트</title>
<style>
  :root {
    --bg: #0e1116; --card: #1a1f27; --card2: #232a35; --line: #303845;
    --txt: #e8ecf1; --dim: #8b95a3; --blue: #4a90ff; --green: #3ddc84;
    --orange: #ff9f43; --red: #ff5c5c; --purple: #b07cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body { background: var(--bg); color: var(--txt); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; max-width: 520px; margin: 0 auto; padding: 14px; }
  h1 { font-size: 17px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: var(--card2); color: var(--dim); }
  .chip.ok { color: var(--green); } .chip.bad { color: var(--red); }
  button { font-family: inherit; color: var(--txt); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; }
  #sensorBtn { width: 100%; padding: 13px; font-size: 15px; font-weight: 700; color: #fff; background: var(--blue); border: 0; border-radius: 12px; margin-bottom: 12px; }
  #sensorBtn:disabled { background: var(--card2); color: var(--dim); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px; position: relative; cursor: pointer; }
  .tile .em { font-size: 22px; }
  .tile .nm { font-size: 14px; font-weight: 700; margin: 2px 0; }
  .tile .tag { font-size: 10px; color: var(--dim); }
  .tile .tag.m { color: var(--blue); } .tile .tag.t { color: var(--orange); } .tile .tag.g { color: var(--purple); }
  .tile .badge { position: absolute; top: 8px; right: 10px; font-size: 13px; font-weight: 800; color: var(--green); }
  .btnrow { display: flex; gap: 8px; margin-bottom: 12px; }
  .btnrow button { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; }
  .btnrow button.rec { color: var(--red); border-color: var(--red); }
  #log { background: var(--card); border-radius: 12px; padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; line-height: 1.5; color: var(--dim); white-space: pre-wrap; word-break: break-all; max-height: 180px; overflow-y: auto; margin-bottom: 12px; }
  #copyFallback { display: none; width: 100%; height: 80px; background: var(--card2); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; font-size: 10px; margin-bottom: 12px; }

  /* 액션 화면 */
  #screen { display: none; }
  .abar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .abar button { padding: 8px 14px; font-size: 14px; }
  .abar .ttl { font-size: 17px; font-weight: 800; flex: 1; }
  .inst { font-size: 12.5px; color: var(--dim); background: var(--card); border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; line-height: 1.5; }
  .needSensor { font-size: 12px; color: var(--orange); background: #2a2010; border-radius: 10px; padding: 9px 12px; margin-bottom: 10px; }
  .bigcount { text-align: center; font-size: 44px; font-weight: 800; color: var(--green); margin: 4px 0; }
  .stateTxt { text-align: center; font-size: 15px; font-weight: 700; min-height: 24px; margin-bottom: 8px; color: var(--dim); }
  .stateTxt.on { color: var(--blue); }
  .area { touch-action: none; user-select: none; -webkit-user-select: none; background: var(--card); border: 2px dashed var(--line); border-radius: 14px; min-height: 260px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; font-size: 15px; color: var(--dim); margin-bottom: 10px; position: relative; overflow: hidden; }
  .area.hit { border-color: var(--green); }
  .area .cEmoji { font-size: 52px; pointer-events: none; }
  .gaugeWrap { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; font-size: 11px; color: var(--dim); }
  .mrow { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .mrow label { width: 58px; flex: none; }
  .bar { flex: 1; height: 13px; background: var(--card2); border-radius: 7px; position: relative; overflow: hidden; }
  .bar .fill { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 7px; background: var(--blue); width: 0; }
  .mrow .val { width: 46px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .srow { display: flex; align-items: center; gap: 8px; margin: 8px 0 2px; font-size: 11px; color: var(--dim); }
  .srow label { width: 58px; flex: none; }
  .srow input[type=range] { flex: 1; }
  .knob { width: 170px; height: 170px; border-radius: 50%; background: conic-gradient(var(--orange) 0deg, var(--card2) 0deg); border: 3px solid var(--line); position: relative; touch-action: none; }
  .knob .pin { position: absolute; left: 50%; top: 8px; width: 6px; height: 26px; background: #fff; border-radius: 3px; transform-origin: 50% 77px; transform: translateX(-50%); }
  .ring { width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--green) 0deg, var(--card2) 0deg); display: flex; align-items: center; justify-content: center; }
  .ring .inner { width: 118px; height: 118px; border-radius: 50%; background: var(--card); display: flex; align-items: center; justify-content: center; font-size: 40px; }
  canvas.paint { border-radius: 12px; display: block; }
  #simBar { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #000c; padding: 6px; gap: 5px; flex-wrap: wrap; justify-content: center; z-index: 9; }
  #simBar button { padding: 5px 9px; font-size: 11px; }
</style>
</head>
<body>
  <div id="home">
    <h1>👨‍🍳 쿠킹클래스 — 동작 테스트</h1>
    <div class="chips">
      <span class="chip" id="chipSecure">https</span>
      <span class="chip" id="chipPlat">plat</span>
      <span class="chip" id="chipPerm">권한: 대기</span>
      <span class="chip" id="chipHz">0 Hz</span>
    </div>
    <button id="sensorBtn">▶ 센서 켜기 (모션·기울기 동작에 필요)</button>
    <div class="grid" id="tileGrid"></div>
    <div class="btnrow">
      <button id="recBtn">⏺ 기록 시작</button>
      <button id="copyBtn">📋 데이터 복사</button>
    </div>
    <textarea id="copyFallback" readonly></textarea>
    <div id="log"></div>
  </div>

  <div id="screen">
    <div class="abar">
      <button id="backBtn">←</button>
      <div class="ttl" id="aTitle"></div>
      <button id="resetBtn">초기화</button>
    </div>
    <div class="needSensor" id="needSensor" style="display:none">⚠️ 이 동작은 센서가 필요해요 — 홈에서 "센서 켜기"를 먼저 눌러주세요</div>
    <div class="inst" id="aInst"></div>
    <div id="aBody"></div>
  </div>

  <div id="simBar"></div>

<script>
(function () {
  'use strict';

  // ================= 공통 =================
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.userAgent.indexOf('Mac') >= 0 && 'ontouchend' in document);
  var cfg = { invert: isIOS };
  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('log'), lines = [];
  function log(msg) {
    lines.unshift('[' + (performance.now() / 1000).toFixed(1) + 's] ' + msg);
    if (lines.length > 60) lines.pop();
    logEl.textContent = lines.join('\n');
  }
  function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
  function vib(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

  $('chipSecure').textContent = window.isSecureContext ? 'secure ✓' : 'insecure!';
  $('chipSecure').className = 'chip ' + (window.isSecureContext ? 'ok' : 'bad');
  $('chipPlat').textContent = isIOS ? 'iOS' : 'Android/기타';

  // ================= 모션 엔진 =================
  // 매 샘플: 중력 기준 수직가속 v, 수평가속 hm, 수평 방향각 변화 dAng,
  // 원형성 ratio(0=왕복,1=회전), 기울기 tiltDeg, 회전속도 rr을 계산해 활성 화면에 전달
  var Engine = (function () {
    var gLP = null, warmupUntil = 0, prevAng = null;
    var hWin = [], hmWin = [], amWin = [];
    var evCount = 0, evWindowStart = 0, hz = 0;
    var sensorOn = false;

    function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
    function norm(a) { var m = Math.sqrt(dot(a, a)) || 1; return { x: a.x / m, y: a.y / m, z: a.z / m }; }
    function cross(a, b) { return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x }; }

    function process(t, ax, ay, az, gx, gy, gz, rr) {
      var s = cfg.invert ? -1 : 1;
      ax *= s; ay *= s; az *= s; gx *= s; gy *= s; gz *= s;
      if (!gLP) { gLP = { x: gx, y: gy, z: gz }; warmupUntil = t + 0.35; prevAng = null; }
      var LP = 0.88;
      gLP.x = LP * gLP.x + (1 - LP) * gx;
      gLP.y = LP * gLP.y + (1 - LP) * gy;
      gLP.z = LP * gLP.z + (1 - LP) * gz;
      var up = norm(gLP);

      var a = { x: ax, y: ay, z: az };
      var am = Math.sqrt(dot(a, a));
      var v = dot(a, up);
      var h = { x: ax - v * up.x, y: ay - v * up.y, z: az - v * up.z };
      var hm = Math.sqrt(dot(h, h));

      var e1 = { x: 1 - up.x * up.x, y: -up.x * up.y, z: -up.x * up.z };
      var e1m = Math.sqrt(dot(e1, e1));
      if (e1m < 0.1) { e1 = { x: -up.y * up.x, y: 1 - up.y * up.y, z: -up.y * up.z }; e1m = Math.sqrt(dot(e1, e1)); }
      e1 = { x: e1.x / e1m, y: e1.y / e1m, z: e1.z / e1m };
      var e2 = cross(up, e1);
      var ang = Math.atan2(dot(h, e2), dot(h, e1));

      var dAng = null;
      if (hm > 1.5) {
        if (prevAng !== null) {
          dAng = ang - prevAng;
          while (dAng > Math.PI) dAng -= 2 * Math.PI;
          while (dAng < -Math.PI) dAng += 2 * Math.PI;
        }
        prevAng = ang;
      } else prevAng = null;

      hWin.push({ t: t, hm: hm, d: dAng });
      while (hWin.length && hWin[0].t < t - 0.7) hWin.shift();
      hmWin.push({ t: t, hm: hm });
      while (hmWin.length && hmWin[0].t < t - 0.4) hmWin.shift();
      amWin.push({ t: t, am: am });
      while (amWin.length && amWin[0].t < t - 0.35) amWin.shift();
      var meanHm = 0, i;
      for (i = 0; i < hmWin.length; i++) meanHm += hmWin[i].hm;
      meanHm /= (hmWin.length || 1);
      var meanAm = 0;
      for (i = 0; i < amWin.length; i++) meanAm += amWin[i].am;
      meanAm /= (amWin.length || 1);

      var sumD = 0, sumAbs = 0;
      for (i = 0; i < hWin.length; i++) {
        var d = hWin[i].d;
        if (d !== null && hWin[i].hm > 2) { sumD += d; sumAbs += Math.abs(d); }
      }
      var ratio = sumAbs > 1.0 ? Math.abs(sumD) / sumAbs : null;

      var tiltDeg = Math.acos(clamp(up.y, -1, 1)) * 180 / Math.PI;

      var sample = { t: t, v: v, hm: hm, meanHm: meanHm, am: am, meanAm: meanAm,
                     ratio: ratio, ang: ang, dAng: dAng, tiltDeg: tiltDeg, rr: rr,
                     ready: t >= warmupUntil };
      if (Router.active && Router.active.onMotion) Router.active.onMotion(sample);
      if (Rec.on && Rec.buf.length < 8000) {
        Rec.buf.push([+t.toFixed(3), +ax.toFixed(2), +ay.toFixed(2), +az.toFixed(2),
                      +gx.toFixed(2), +gy.toFixed(2), +gz.toFixed(2),
                      rr ? +(rr.alpha || 0).toFixed(1) : 0, rr ? +(rr.beta || 0).toFixed(1) : 0, rr ? +(rr.gamma || 0).toFixed(1) : 0]);
      }
    }

    function onDevMotion(e) {
      var t = performance.now() / 1000;
      evCount++;
      if (t - evWindowStart >= 1) { hz = evCount; evCount = 0; evWindowStart = t; $('chipHz').textContent = hz + ' Hz'; }
      var g = e.accelerationIncludingGravity;
      if (!g || g.x === null) return;
      var a = e.acceleration, ax, ay, az;
      if (a && a.x !== null) { ax = a.x; ay = a.y; az = a.z; }
      else if (gLP) {
        var s2 = cfg.invert ? -1 : 1;
        ax = g.x - gLP.x * s2; ay = g.y - gLP.y * s2; az = g.z - gLP.z * s2;
      } else { ax = 0; ay = 0; az = 0; }
      process(t, ax, ay, az, g.x, g.y, g.z, e.rotationRate);
    }

    function start() {
      log('secure: ' + window.isSecureContext + ' / ' + navigator.userAgent.slice(0, 70));
      var DME = window.DeviceMotionEvent;
      if (!DME) { log('❌ DeviceMotionEvent 미지원'); setPerm('미지원', false); return; }
      if (typeof DME.requestPermission === 'function') {
        log('requestPermission() 호출 → 팝업이 떠야 정상 (토스 WebView go/no-go!)');
        DME.requestPermission().then(function (r) {
          log('requestPermission 결과: ' + r);
          setPerm(r, r === 'granted');
          if (r === 'granted') attach();
        }).catch(function (err) { log('❌ requestPermission 에러: ' + err); setPerm('에러', false); });
      } else {
        log('requestPermission 불필요(비iOS) — 바로 연결');
        setPerm('불필요', true);
        attach();
      }
    }
    function setPerm(txt, ok) {
      $('chipPerm').textContent = '권한: ' + txt;
      $('chipPerm').className = 'chip ' + (ok ? 'ok' : 'bad');
    }
    function attach() {
      sensorOn = true;
      evWindowStart = performance.now() / 1000;
      window.addEventListener('devicemotion', onDevMotion);
      $('sensorBtn').textContent = '✓ 센서 연결됨';
      $('sensorBtn').disabled = true;
      setTimeout(function () {
        if (hz === 0 && evCount === 0) log('⚠️ 1.5초간 센서 이벤트 없음 — HTTPS/기기 지원 확인');
      }, 1500);
      Router.refreshSensorNotice();
    }

    return { start: start, process: process, isOn: function () { return sensorOn; } };
  })();

  // ================= 기록 =================
  var Rec = { on: false, buf: [], events: [] };
  $('recBtn').addEventListener('click', function () {
    Rec.on = !Rec.on;
    if (Rec.on) { Rec.buf = []; Rec.events = []; this.textContent = '⏹ 기록 정지'; this.classList.add('rec'); log('기록 시작'); }
    else { this.textContent = '⏺ 기록 시작'; this.classList.remove('rec'); log('기록 정지 — 샘플 ' + Rec.buf.length + '개'); }
  });
  $('copyBtn').addEventListener('click', function () {
    var payload = JSON.stringify({
      meta: { ua: navigator.userAgent, ios: isIOS, invert: cfg.invert, secure: window.isSecureContext },
      columns: ['t', 'ax', 'ay', 'az', 'gx', 'gy', 'gz', 'rrA', 'rrB', 'rrG'],
      samples: Rec.buf, events: Rec.events
    });
    function fb(txt) { var f = $('copyFallback'); f.style.display = 'block'; f.value = txt; f.select(); log('클립보드 실패 — 텍스트를 길게 눌러 복사'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(function () { log('복사 완료 (' + payload.length + '자)'); }, function () { fb(payload); });
    } else fb(payload);
  });

  // ================= 공용 위젯 =================
  function meterRow(label) {
    var row = document.createElement('div'); row.className = 'mrow';
    row.innerHTML = '<label>' + label + '</label><div class="bar"><div class="fill"></div></div><span class="val">0</span>';
    return { el: row, set: function (frac, txt) { row.querySelector('.fill').style.width = clamp(frac, 0, 1) * 100 + '%'; row.querySelector('.val').textContent = txt; } };
  }
  function slider(label, min, max, step, val, onChange) {
    var row = document.createElement('div'); row.className = 'srow';
    row.innerHTML = '<label>' + label + '</label><input type="range" min="' + min + '" max="' + max + '" step="' + step + '" value="' + val + '"><span class="val">' + val + '</span>';
    row.querySelector('input').addEventListener('input', function () {
      row.querySelector('.val').textContent = this.value;
      onChange(parseFloat(this.value));
    });
    return row;
  }
  // 임계 초과 → 하락 시 1회로 세는 피크 카운터
  function peakCounter(minGap) {
    var lastT = -9, over = false;
    return function (val, t, thresh) {
      if (val > thresh) { over = true; return false; }
      if (over && val < thresh * 0.6) {
        over = false;
        if (t - lastT > minGap) { lastT = t; return true; }
      }
      return false;
    };
  }
  // 터치 스트로크 추적
  function strokeTracker(el, onStroke) {
    var st = null;
    el.addEventListener('pointerdown', function (e) {
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      st = { x0: e.clientX, y0: e.clientY, t0: performance.now(), pts: [[e.clientX, e.clientY]] };
      e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) { if (st) st.pts.push([e.clientX, e.clientY]); });
    function end(e) {
      if (!st) return;
      var dx = e.clientX - st.x0, dy = e.clientY - st.y0;
      var len = Math.hypot(dx, dy), dur = performance.now() - st.t0;
      var dev = 0;
      if (len > 5) {
        for (var i = 0; i < st.pts.length; i++) {
          var px = st.pts[i][0] - st.x0, py = st.pts[i][1] - st.y0;
          var cr = Math.abs(px * dy - py * dx) / len;
          if (cr > dev) dev = cr;
        }
      }
      onStroke({ dx: dx, dy: dy, len: len, dur: dur, dev: len > 5 ? dev / len : 1 });
      st = null;
    }
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', function () { st = null; });
  }
  // 중심 기준 회전 추적 (다이얼/휘젓기)
  function rotaryTracker(el, onDelta) {
    var last = null;
    function angOf(e) {
      var r = el.getBoundingClientRect();
      return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2));
    }
    el.addEventListener('pointerdown', function (e) {
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      last = angOf(e); e.preventDefault();
    });
    el.addEventListener('pointermove', function (e) {
      if (last === null) return;
      var a = angOf(e), d = a - last;
      while (d > Math.PI) d -= 2 * Math.PI;
      while (d < -Math.PI) d += 2 * Math.PI;
      last = a; onDelta(d);
    });
    el.addEventListener('pointerup', function () { last = null; });
    el.addEventListener('pointercancel', function () { last = null; });
  }
  // 길게 누르기 추적 (rAF 대신 interval: 백그라운드 탭에서도 진행되도록)
  function holdTracker(el, targetMs, onProg, onDone) {
    var t0 = null, timer = null;
    function tick() {
      if (t0 === null) return;
      var p = clamp((performance.now() - t0) / targetMs, 0, 1);
      onProg(p);
      if (p >= 1) { stopTimer(); t0 = null; onDone(); }
    }
    function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
    el.addEventListener('pointerdown', function (e) {
      try { el.setPointerCapture(e.pointerId); } catch (x) {}
      t0 = performance.now(); stopTimer(); timer = setInterval(tick, 66); tick(); e.preventDefault();
    });
    function stop() { stopTimer(); if (t0 !== null) onProg(0); t0 = null; }
    el.addEventListener('pointerup', stop);
    el.addEventListener('pointercancel', stop);
  }

  // ================= 액션 정의 =================
  // 각 액션: {id, em, nm, tag('모션'|'터치'|'기울기'), inst, needSensor, build(body, api)}
  // api: count(n?) 카운트 표시+홈 배지, event(detail) 로그+기록, flash() 영역 강조
  var ACTIONS = [
    { id: 'stirfry', em: '🍳', nm: '볶기', tag: '모션', needSensor: true,
      inst: '팬을 채듯 <b>앞뒤로 촥촥</b> 흔들어요 (직선 왕복). 원을 그리면 휘젓기와 헷갈리니 왕복만!',
      build: function (body, api) {
        var st = { thresh: 4, peak: peakCounter(0.12) };
        var state = document.createElement('div'); state.className = 'stateTxt'; body.appendChild(state);
        var cnt = document.createElement('div'); cnt.className = 'bigcount'; cnt.textContent = '0'; body.appendChild(cnt);
        var gw = document.createElement('div'); gw.className = 'gaugeWrap'; body.appendChild(gw);
        var m1 = meterRow('수평 세기'), m2 = meterRow('원형성');
        gw.appendChild(m1.el); gw.appendChild(m2.el);
        gw.appendChild(slider('민감도', 2, 8, 0.5, st.thresh, function (v) { st.thresh = v; }));
        var n = 0;

    { id: 'spread', em: '🧈', nm: '바르기', tag: '터치', needSensor: false,
      inst: '식빵 전체에 버터를 <b>고르게 발라요</b> — 빈 곳 없이 문질러 95% 채우면 성공!',
      build: function (body, api) {
        var wrap = document.createElement('div'); wrap.className = 'area'; wrap.style.padding = '10px';
        var cv = document.createElement('canvas'); cv.className = 'paint';
        wrap.appendChild(cv); body.appendChild(wrap);
        var state = document.createElement('div'); state.className = 'stateTxt'; body.appendChild(state);
        var ctx = cv.getContext('2d');
        var COLS = 16, ROWS = 12, cells, W, H, n = 0;
        function init() {
          W = clamp(wrap.clientWidth - 20, 240, 460); H = 240;
          cv.width = W; cv.height = H;
          cells = [];
          for (var i = 0; i < COLS * ROWS; i++) cells.push(false);
          ctx.fillStyle = '#caa472'; ctx.fillRect(0, 0, W, H);
          state.textContent = '0%';
        }
        function paintAt(x, y) {
          if (!cells) return;
          var r = cv.getBoundingClientRect();
          if (r.width < 10) return;
          var px = (x - r.left) * (W / r.width), py = (y - r.top) * (H / r.height);
          ctx.fillStyle = '#ffe08a';
          ctx.beginPath(); ctx.arc(px, py, 26, 0, 7); ctx.fill();
          var painted = 0;
          for (var cx = 0; cx < COLS; cx++) for (var cy = 0; cy < ROWS; cy++) {
            var ix = cy * COLS + cx;
            if (!cells[ix]) {
              var dx = px - (cx + 0.5) * W / COLS, dy = py - (cy + 0.5) * H / ROWS;
              if (dx * dx + dy * dy < 26 * 26) cells[ix] = true;
            }
            if (cells[ix]) painted++;
          }
          var pct = painted / cells.length * 100;
          state.textContent = pct.toFixed(0) + '%' + (pct >= 95 ? ' — 고르게 발랐어요! 🧈✓' : '');
          state.className = 'stateTxt' + (pct >= 95 ? ' on' : '');
          api.count(Math.round(pct));
        }
        var downFlag = false;
        cv.addEventListener('pointerdown', function (e) { try { cv.setPointerCapture(e.pointerId); } catch (x) {} downFlag = true; paintAt(e.clientX, e.clientY); e.preventDefault(); });
        cv.addEventListener('pointermove', function (e) { if (downFlag) paintAt(e.clientX, e.clientY); });
        cv.addEventListener('pointerup', function () { downFlag = false; });
        cv.addEventListener('pointercancel', function () { downFlag = false; });
        init();
        this.reset = init;
      } },

    { id: 'shake', em: '🧂', nm: '흔들기', tag: '모션', needSensor: true,

    { id: 'roll', em: '🍣', nm: '말기', tag: '모션', needSensor: false,
      inst: '<b>수직(90°)으로 + 천천히 부드럽게</b> 올려야 말려요 — 각도가 어긋나거나 <b>너무 빠르면 실패!</b> 모션(폰 들어올리기)과 터치(위로 쓸어올리기) 모두 같은 기준이에요. 5칸이면 완성!',
      build: function (body, api) {
        var st = { thresh: 3, tol: 10, vmax: 8, smax: 600, refUntil: 0, pend: null };
        var state = document.createElement('div'); state.className = 'stateTxt'; body.appendChild(state);
        var prog = document.createElement('div'); prog.className = 'bigcount'; prog.style.fontSize = '34px'; body.appendChild(prog);
        var gw = document.createElement('div'); gw.className = 'gaugeWrap'; body.appendChild(gw);
        var m1 = meterRow('수직 가속');
        gw.appendChild(m1.el);
        gw.appendChild(slider('민감도', 2, 8, 0.5, st.thresh, function (v) { st.thresh = v; }));
        gw.appendChild(slider('허용 각도', 5, 45, 1, st.tol, function (v) { st.tol = v; }));
        gw.appendChild(slider('속도제한(모션)', 4, 16, 0.5, st.vmax, function (v) { st.vmax = v; }));
        gw.appendChild(slider('속도제한(터치)', 200, 2000, 50, st.smax, function (v) { st.smax = v; }));
        var area = document.createElement('div'); area.className = 'area'; area.style.minHeight = '160px';
        area.innerHTML = '<span class="cEmoji">🍙</span><span>위로 쓸어올리기 (터치 대체)</span>';
        body.appendChild(area);
        var cnt = document.createElement('div'); cnt.className = 'stateTxt'; body.appendChild(cnt);
        var seg = 0, done = 0, fails = 0;
        function show() {
          var t = '';
          for (var i = 0; i < 5; i++) t += i < seg ? '🍙' : '▫️';
          prog.textContent = t;
          cnt.textContent = '완성한 김밥: ' + done + '줄 · 실패: ' + fails + '회';
        }
        function addSeg(src) {
          seg++;
          api.event(src + ' +1칸'); vib(15);
          state.textContent = '한 칸 말았어요! (' + src + ')'; state.className = 'stateTxt on';
          if (seg >= 5) { seg = 0; done++; api.count(done); state.textContent = '김밥 완성! 🍣'; vib(60); }
          show();
        }
        function fail(msg) {
          fails++;
          api.event('실패 — ' + msg); vib(80);
          state.textContent = '❌ ' + msg + ' — 실패!'; state.className = 'stateTxt';
          show();
        }
        this.onMotion = function (s) {
          if (!s.ready) return;
          if (st.pend) {
            // 스트로크가 끝날 때까지 가속 벡터를 적분: 방향(수직 순수도)과 속도(피크 가속)를 함께 판정
            var dt = s.t - st.pend.last;
            if (dt > 0 && dt < 0.1) {
              if (s.v > 0) st.pend.vi += s.v * dt;
              if (s.hm > 1.2) {
                st.pend.hx += s.hm * Math.cos(s.ang) * dt;
                st.pend.hy += s.hm * Math.sin(s.ang) * dt;
              }
            }
            st.pend.last = s.t;
            if (s.v > st.pend.peak) st.pend.peak = s.v;
            if (s.v < 1) { if (st.pend.low === null) st.pend.low = s.t; }
            else st.pend.low = null;
            if ((st.pend.low !== null && s.t - st.pend.low > 0.12) || s.t - st.pend.t0 > 1.2) {
              var vi = st.pend.vi, peak = st.pend.peak;
              var hInt = Math.hypot(st.pend.hx, st.pend.hy);
              var dev = Math.atan2(hInt, Math.max(vi, 0.001)) * 180 / Math.PI;
              st.pend = null; st.refUntil = s.t + 0.5;
              if (vi >= 0.25) { // 상승량이 너무 작으면 스트로크로 안 봄
                if (peak > st.vmax) fail('너무 빨라요 (피크 ' + peak.toFixed(1) + ')');
                else if (dev > st.tol) fail(dev.toFixed(0) + '° 어긋남');
                else addSeg('모션 ' + dev.toFixed(0) + '°·피크 ' + peak.toFixed(1));
              }
            }
          } else if (s.t > st.refUntil && s.v > st.thresh) {
            st.pend = { t0: s.t, last: s.t, vi: 0, hx: 0, hy: 0, peak: s.v, low: null };
          }
          m1.set(Math.abs(s.v) / 20, s.v.toFixed(1));
        };
        strokeTracker(area, function (sk) {
          if (sk.dy > -60) return; // 위로 향한 스와이프만 판정 대상
          var speed = sk.len / Math.max(sk.dur, 1) * 1000;
          var devT = Math.atan2(Math.abs(sk.dx), -sk.dy) * 180 / Math.PI;
          if (speed > st.smax) fail('너무 빨라요 (' + speed.toFixed(0) + 'px/s)');
          else if (devT > st.tol) fail(devT.toFixed(0) + '° 어긋남');
          else addSeg('터치 ' + devT.toFixed(0) + '°');
        });
        show();
        this.reset = function () { seg = 0; done = 0; fails = 0; st.pend = null; api.count(0); state.textContent = ''; show(); };
      } },

    { id: 'mash', em: '🥔', nm: '으깨기', tag: '터치', needSensor: false,
      inst: '감자를 <b>꾹 눌러 으깨요</b> — 2초 유지하면 1회. (누르기보다 길어요)',
      build: function (body, api) {
        var wrap = document.createElement('div'); wrap.className = 'area'; wrap.style.minHeight = '230px';
        var ring = document.createElement('div'); ring.className = 'ring';
        ring.innerHTML = '<div class="inner">🥔</div>';
        wrap.appendChild(ring); body.appendChild(wrap);
        var cnt = document.createElement('div'); cnt.className = 'bigcount'; cnt.textContent = '0'; body.appendChild(cnt);
        var n = 0;
        holdTracker(wrap, 2000, function (p) {
          ring.style.background = 'conic-gradient(var(--orange) ' + p * 360 + 'deg, var(--card2) ' + p * 360 + 'deg)';
          ring.querySelector('.inner').style.transform = 'scale(' + (1 - p * 0.25) + ')';
        }, function () {
          n++; cnt.textContent = n; api.count(n); api.event('완료'); vib(50);
          ring.querySelector('.inner').textContent = '🥣';
          setTimeout(function () { ring.querySelector('.inner').textContent = '🥔'; ring.style.background = ''; ring.querySelector('.inner').style.transform = ''; }, 500);
        });
        this.reset = function () { n = 0; cnt.textContent = '0'; api.count(0); };
      } },

    { id: 'grate', em: '🧀', nm: '갈기', tag: '모션', needSensor: true,
      inst: '치즈를 강판에 갈듯 <b>폰을 사방팔방 흔들어요</b> — 흔들림 하나하나가 1회로 카운트돼요.',
      build: function (body, api) {
        var st = { thresh: 5, peak: peakCounter(0.12) };
        var stateM = document.createElement('div'); stateM.className = 'stateTxt'; body.appendChild(stateM);
        var cnt = document.createElement('div'); cnt.className = 'bigcount'; cnt.textContent = '0'; body.appendChild(cnt);
        var gw = document.createElement('div'); gw.className = 'gaugeWrap'; body.appendChild(gw);
        var m1 = meterRow('흔들 세기');
        gw.appendChild(m1.el);
        gw.appendChild(slider('민감도', 3, 10, 0.5, st.thresh, function (v) { st.thresh = v; }));
        var n = 0;
        this.onMotion = function (s) {
          if (!s.ready) return;
          var active = s.meanAm > st.thresh * 0.8;
          stateM.textContent = active ? '갈리는 중! 🧀' : '대기';
          stateM.className = 'stateTxt' + (active ? ' on' : '');
          // 사방팔방 흔들기: 방향 무관 가속 피크 하나하나 = 1회
          if (st.peak(s.am, s.t, st.thresh * 1.4)) { n++; cnt.textContent = n; api.count(n); vib(8); }
          m1.set(s.meanAm / 15, s.meanAm.toFixed(1));
        };
        this.reset = function () { n = 0; cnt.textContent = '0'; api.count(0); stateM.textContent = ''; };
      } },
  ];

  // ================= 라우터 =================
  var Router = { active: null };
  var tileGrid = $('tileGrid');
  ACTIONS.forEach(function (act) {
    var tile = document.createElement('div'); tile.className = 'tile';
    var tagCls = act.tag === '모션' ? 'm' : act.tag === '기울기' ? 'g' : 't';
    tile.innerHTML = '<span class="em">' + act.em + '</span><div class="nm">' + act.nm + '</div>' +
      '<span class="tag ' + tagCls + '">' + act.tag + '</span><span class="badge"></span>';
    tile.addEventListener('click', function () { open(act); });
    act._badge = tile.querySelector('.badge');
    tileGrid.appendChild(tile);
  });

  function open(act) {
    $('home').style.display = 'none';
    $('screen').style.display = 'block';
    $('aTitle').textContent = act.em + ' ' + act.nm;
    $('aInst').innerHTML = act.inst;
    var body = $('aBody');
    body.innerHTML = '';
    var api = {
      count: function (v) { act._badge.textContent = v || ''; },
      event: function (detail) {
        log(act.nm + ': ' + detail);
        if (Rec.on) Rec.events.push({ t: +(performance.now() / 1000).toFixed(3), action: act.id, detail: detail });
      },
    };
    var inst = Object.create(act);
    inst.build(body, api);
    Router.active = inst;
    Router.refreshSensorNotice();
  }
  Router.refreshSensorNotice = function () {
    var a = Router.active;
    $('needSensor').style.display = (a && a.needSensor && !Engine.isOn()) ? 'block' : 'none';
  };
  $('backBtn').addEventListener('click', function () {
    Router.active = null;
    $('screen').style.display = 'none';
    $('home').style.display = 'block';
  });
  $('resetBtn').addEventListener('click', function () {
    if (Router.active && Router.active.reset) Router.active.reset();
  });

  $('sensorBtn').addEventListener('click', Engine.start);

  // ================= 시뮬레이션 (데스크톱 검증용) =================
  // window.__sim.run('flip'|'pan'|'whisk'|'shake'|'pour'|'roll') — 합성 신호를 동기 배치 주입
  var __sim = { _t: 0 };
  __sim.run = function (name) {
    var G = 9.81, dur, gen;
    var flat = function (a, rr) { return { a: a, g: { x: a.x, y: a.y, z: a.z + G }, rr: rr || null }; };
    var Z = { x: 0, y: 0, z: 0 };
    if (name === 'flip') { dur = 2.2; gen = function (el) {
      if (el < 0.5) return flat(Z);
      var e = el - 0.5;
      if (e < 0.12) return flat({ x: 0, y: 0, z: 14 });
      if (e < 0.24) return flat({ x: 0, y: 0, z: -8 });
      return flat(Z); }; }
    else if (name === 'pan') { dur = 3.4; gen = function (el) {
      if (el < 0.5 || el > 2.1) return flat(Z);
      return flat({ x: 8 * Math.sin(2 * Math.PI * 4.5 * (el - 0.5)), y: 0, z: 0 }); }; }
    else if (name === 'whisk') { dur = 3.4; gen = function (el) {
      if (el < 0.5 || el > 2.1) return flat(Z);
      var e = el - 0.5;
      return flat({ x: 6 * Math.cos(2 * Math.PI * 2.2 * e), y: 6 * Math.sin(2 * Math.PI * 2.2 * e), z: 0 }); }; }
    else if (name === 'shake') { dur = 3.2; gen = function (el) {
      if (el < 0.5 || el > 1.9) return flat(Z);
      var e = el - 0.5;
      return flat({ x: 7 * Math.sin(2 * Math.PI * 4 * e), y: 5 * Math.sin(2 * Math.PI * 3.1 * e + 1), z: 4 * Math.sin(2 * Math.PI * 5 * e + 2) }); }; }
    else if (name === 'pour') { dur = 4.5; gen = function (el) {
      var deg = el < 0.6 ? 0 : el < 1.4 ? (el - 0.6) / 0.8 * 70 : el < 3.4 ? 70 : Math.max(0, 70 - (el - 3.4) / 0.6 * 70);
      var r = deg * Math.PI / 180;
      return { a: Z, g: { x: G * Math.sin(r), y: G * Math.cos(r), z: 0 }, rr: null }; }; }
    else if (name === 'lift') { dur = 2.6; gen = function (el) {
      if (el < 0.5) return flat(Z);
      var e = el - 0.5;
      if (e < 0.4) return flat({ x: 0, y: 0, z: 3.5 });
      if (e < 0.8) return flat({ x: 0, y: 0, z: -3.5 });
      return flat(Z); }; }
    else if (name === 'lifttilt') { dur = 2.6; gen = function (el) {
      if (el < 0.5) return flat(Z);
      var e = el - 0.5;
      if (e < 0.4) return flat({ x: 2.5, y: 0, z: 3.2 });
      if (e < 0.8) return flat({ x: -2.5, y: 0, z: -3.2 });
      return flat(Z); }; }
    else if (name === 'liftfast') { dur = 2.2; gen = function (el) {
      if (el < 0.5) return flat(Z);
      var e = el - 0.5;
      if (e < 0.12) return flat({ x: 0, y: 0, z: 12 });
      if (e < 0.24) return flat({ x: 0, y: 0, z: -6 });
      return flat(Z); }; }
    else { log('SIM: 알 수 없음 ' + name); return; }
    var t0 = Math.max(performance.now() / 1000, __sim._t);
    var n = function () { return (Math.random() - 0.5) * 0.5; };
    for (var el = 0; el <= dur; el += 1 / 60) {
      var s = gen(el);
      Engine.process(t0 + el, s.a.x + n(), s.a.y + n(), s.a.z + n(),
                     s.g.x + n(), s.g.y + n(), s.g.z + n(), s.rr);
    }
    __sim._t = t0 + dur + 0.01;
    log('SIM 완료: ' + name);
  };
  window.__sim = __sim;
  if (location.search.indexOf('sim') >= 0) {
    var bar = $('simBar'); bar.style.display = 'flex';
    ['flip', 'pan', 'whisk', 'shake', 'pour', 'lift', 'lifttilt', 'liftfast'].forEach(function (nm) {
      var b = document.createElement('button'); b.textContent = 'SIM ' + nm;
      b.addEventListener('click', function () { __sim.run(nm); });
      bar.appendChild(b);
    });
  }

  log('쿠킹클래스 동작 테스트 로드 완료 — 13종');
})();
</script>
</body>
</html>
