<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>모션 감지 테스트</title>
<style>
  :root {
    --bg: #0e1116; --card: #1a1f27; --card2: #232a35; --line: #303845;
    --txt: #e8ecf1; --dim: #8b95a3; --blue: #4a90ff; --green: #3ddc84;
    --orange: #ff9f43; --red: #ff5c5c; --purple: #b07cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--txt); font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; padding: 14px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 17px; margin-bottom: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { font-size: 11px; padding: 3px 8px; border-radius: 10px; background: var(--card2); color: var(--dim); }
  .chip.ok { color: var(--green); } .chip.bad { color: var(--red); }
  #startBtn { width: 100%; padding: 15px; font-size: 17px; font-weight: 700; color: #fff; background: var(--blue); border: 0; border-radius: 12px; margin-bottom: 12px; }
  #startBtn:disabled { background: var(--card2); color: var(--dim); }
  #stateBanner { text-align: center; font-size: 19px; font-weight: 700; padding: 13px; border-radius: 12px; background: var(--card); margin-bottom: 12px; min-height: 50px; transition: background .15s; }
  #stateBanner.flash { background: var(--purple); }
  #stateBanner.shaking { background: #1d3050; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 10px; transition: border-color .12s, background .12s; }
  .tile.hit { border-color: var(--green); background: #14301f; }
  .tile.live { border-color: var(--blue); background: #14243a; }
  .tile .em { font-size: 22px; }
  .tile .nm { font-size: 14px; font-weight: 700; margin: 2px 0; }
  .tile .ct { font-size: 20px; font-weight: 800; color: var(--green); }
  .tile .gd { font-size: 10.5px; color: var(--dim); line-height: 1.35; margin-top: 3px; }
  .meters { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 11px; color: var(--dim); }
  .mrow { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .mrow label { width: 52px; flex: none; }
  .bar { flex: 1; height: 14px; background: var(--card2); border-radius: 7px; position: relative; overflow: hidden; }
  .bar .fill { position: absolute; top: 0; bottom: 0; border-radius: 7px; }
  #vBar .fill { background: var(--orange); }
  #hBar .fill { background: var(--blue); left: 0; }
  #cBar .fill { background: var(--purple); left: 0; }
  .bar .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--dim); }
  .mrow .val { width: 44px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  details { background: var(--card); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-size: 12px; }
  summary { cursor: pointer; color: var(--dim); font-weight: 600; }
  .srow { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; }
  .srow label { width: 105px; flex: none; color: var(--dim); }
  .srow input[type=range] { flex: 1; }
  .srow .sv { width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  .btnrow { display: flex; gap: 8px; margin-bottom: 12px; }
  .btnrow button { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; color: var(--txt); background: var(--card2); border: 1px solid var(--line); border-radius: 10px; }
  .btnrow button.rec { color: var(--red); border-color: var(--red); }
  #log { background: var(--card); border-radius: 12px; padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; line-height: 1.5; color: var(--dim); white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; margin-bottom: 12px; }
  #simPanel { display: none; background: var(--card); border: 1px dashed var(--purple); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; }
  #simPanel .btnrow { margin: 8px 0 0; }
  #copyFallback { display: none; width: 100%; height: 80px; background: var(--card2); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; font-size: 10px; margin-bottom: 12px; }
</style>
</head>
<body>
  <h1>🍳 모션 감지 테스트</h1>
  <div class="chips">
    <span class="chip" id="chipSecure">https</span>
    <span class="chip" id="chipPlat">plat</span>
    <span class="chip" id="chipPerm">권한: 대기</span>
    <span class="chip" id="chipHz">0 Hz</span>
  </div>

  <button id="startBtn">▶ 센서 시작 (iOS는 권한 팝업 확인)</button>
  <div id="stateBanner">대기 중</div>

  <div class="grid">
    <div class="tile" id="t_stir"><span class="em">🍳</span><div class="nm">볶기</div><div class="ct">0</div><div class="gd">폰을 팬처럼 눕혀 잡고 수평으로 원을 그리며 흔들기</div></div>
    <div class="tile" id="t_flip"><span class="em">🥞</span><div class="nm">뒤집기</div><div class="ct">0</div><div class="gd">위로 한 번 휙! (팬케이크 던지듯)</div></div>
    <div class="tile" id="t_strain"><span class="em">🍜</span><div class="nm">체 거르기</div><div class="ct">0</div><div class="gd">좌우로 촥촥촥 흔들기 (직선 왕복)</div></div>
    <div class="tile" id="t_chop"><span class="em">🔪</span><div class="nm">칼질</div><div class="ct">0</div><div class="gd">아래로 짧게 툭툭 (도마질하듯)</div></div>
  </div>

  <div class="meters">
    <div class="mrow"><label>수직 가속</label><div class="bar" id="vBar"><div class="mid"></div><div class="fill"></div></div><span class="val" id="vVal">0.0</span></div>
    <div class="mrow"><label>수평 세기</label><div class="bar" id="hBar"><div class="fill"></div></div><span class="val" id="hVal">0.0</span></div>
    <div class="mrow"><label>원형성</label><div class="bar" id="cBar"><div class="fill"></div></div><span class="val" id="cVal">-</span></div>
  </div>

  <details>
    <summary>⚙️ 임계값 튜닝</summary>
    <div class="srow"><label>임펄스 임계값</label><input type="range" id="sImp" min="4" max="20" step="0.5" value="9"><span class="sv" id="svImp">9</span></div>
    <div class="srow"><label>흔들기 임계값</label><input type="range" id="sShake" min="2" max="10" step="0.5" value="4"><span class="sv" id="svShake">4</span></div>
    <div class="srow"><label>원형성 경계</label><input type="range" id="sCirc" min="0.2" max="0.8" step="0.05" value="0.45"><span class="sv" id="svCirc">0.45</span></div>
    <div class="srow"><label>축 반전</label><input type="checkbox" id="sInvert"><span class="sv" id="svInvert"></span></div>
  </details>

  <div class="btnrow">
    <button id="recBtn">⏺ 기록 시작</button>
    <button id="copyBtn">📋 데이터 복사</button>
  </div>
  <textarea id="copyFallback" readonly></textarea>

  <div id="simPanel">
    <b style="font-size:12px">🧪 시뮬레이션 (합성 신호 주입)</b>
    <div class="btnrow">
      <button data-sim="stir">볶기</button>
      <button data-sim="flip">뒤집기</button>
      <button data-sim="strain">체거르기</button>
      <button data-sim="chop">칼질×3</button>
    </div>
  </div>

  <div id="log"></div>

<script>
(function () {
  'use strict';

  // ---------- 플랫폼/상태 ----------
  var isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) ||
              (navigator.userAgent.indexOf('Mac') >= 0 && 'ontouchend' in document);
  var cfg = { imp: 9, shake: 4, circ: 0.45, invert: isIOS };

  var $ = function (id) { return document.getElementById(id); };
  var logEl = $('log');
  var lines = [];
  function log(msg) {
    var t = (performance.now() / 1000).toFixed(1);
    lines.unshift('[' + t + 's] ' + msg);
    if (lines.length > 60) lines.pop();
    logEl.textContent = lines.join('\n');
  }

  $('chipSecure').textContent = window.isSecureContext ? 'secure ✓' : 'insecure!';
  $('chipSecure').className = 'chip ' + (window.isSecureContext ? 'ok' : 'bad');
  $('chipPlat').textContent = isIOS ? 'iOS' : 'Android/기타';
  $('sInvert').checked = cfg.invert;
  $('svInvert').textContent = cfg.invert ? 'iOS자동' : '';

  // ---------- 벡터 유틸 ----------
  function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }
  function norm(a) {
    var m = Math.sqrt(dot(a, a)) || 1;
    return { x: a.x / m, y: a.y / m, z: a.z / m };
  }
  function cross(a, b) {
    return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
  }

  // ---------- 감지 파이프라인 ----------
  var gLP = null;                  // 저역 통과된 중력(includingGravity)
  var warmupUntil = 0;             // 중력 추정이 안정될 때까지 감지 보류
  var hWin = [];                   // {t, hm, ang} 최근 0.7s
  var hmWin = [];                  // {t, hm} 최근 0.4s (임펄스용 평균)
  var refractoryUntil = 0;
  var shake = { active: false, candSince: null, lowSince: null, startT: 0, stirFrames: 0, strainFrames: 0, liveLabel: null };
  var counts = { stir: 0, flip: 0, strain: 0, chop: 0 };
  var evCount = 0, evWindowStart = 0, hz = 0;
  var lastUiT = 0;
  var recording = false, recBuf = [], recEvents = [];
  var latest = { v: 0, hm: 0, ratio: null };

  function processSample(t, ax, ay, az, gx, gy, gz, rr) {
    var s = cfg.invert ? -1 : 1;
    ax *= s; ay *= s; az *= s; gx *= s; gy *= s; gz *= s;

    if (!gLP) { gLP = { x: gx, y: gy, z: gz }; warmupUntil = t + 0.35; }
    var LP = 0.88;
    gLP.x = LP * gLP.x + (1 - LP) * gx;
    gLP.y = LP * gLP.y + (1 - LP) * gy;
    gLP.z = LP * gLP.z + (1 - LP) * gz;
    var up = norm(gLP);

    var a = { x: ax, y: ay, z: az };
    var v = dot(a, up);
    var h = { x: ax - v * up.x, y: ay - v * up.y, z: az - v * up.z };
    var hm = Math.sqrt(dot(h, h));

    // 수평면 기저 (중력 기준, 천천히 변하므로 매 샘플 재계산해도 안정적)
    var e1 = { x: 1 - up.x * up.x, y: -up.x * up.y, z: -up.x * up.z };
    var e1m = Math.sqrt(dot(e1, e1));
    if (e1m < 0.1) { e1 = { x: -up.y * up.x, y: 1 - up.y * up.y, z: -up.y * up.z }; e1m = Math.sqrt(dot(e1, e1)); }
    e1 = { x: e1.x / e1m, y: e1.y / e1m, z: e1.z / e1m };
    var e2 = cross(up, e1);
    var ang = Math.atan2(dot(h, e2), dot(h, e1));

    hWin.push({ t: t, hm: hm, ang: ang });
    while (hWin.length && hWin[0].t < t - 0.7) hWin.shift();
    hmWin.push({ t: t, hm: hm });
    while (hmWin.length && hmWin[0].t < t - 0.4) hmWin.shift();
    var meanHm = 0;
    for (var i = 0; i < hmWin.length; i++) meanHm += hmWin[i].hm;
    meanHm /= (hmWin.length || 1);

    // --- 원형성: 수평 가속 벡터 방향각 변화의 일관성 ---
    var minH = Math.max(1.5, cfg.shake * 0.5);
    var sumD = 0, sumAbs = 0, prev = null;
    for (var j = 0; j < hWin.length; j++) {
      var p = hWin[j];
      if (p.hm < minH) { prev = null; continue; }
      if (prev !== null) {
        var d = p.ang - prev;
        while (d > Math.PI) d -= 2 * Math.PI;
        while (d < -Math.PI) d += 2 * Math.PI;
        sumD += d; sumAbs += Math.abs(d);
      }
      prev = p.ang;
    }
    var ratio = sumAbs > 1.0 ? Math.abs(sumD) / sumAbs : null;

    // --- 흔들기 상태 머신 (볶기/체거르기) ---
    if (!shake.active) {
      if (t >= warmupUntil && meanHm > cfg.shake) {
        if (shake.candSince === null) shake.candSince = t;
        if (t - shake.candSince > 0.3) {
          shake.active = true; shake.startT = t; shake.lowSince = null;
          shake.stirFrames = 0; shake.strainFrames = 0; shake.liveLabel = null;
          log('흔들기 시작 (평균 수평 ' + meanHm.toFixed(1) + ')');
        }
      } else {
        shake.candSince = null;
      }
    } else {
      if (ratio !== null) {
        if (ratio > cfg.circ + 0.08) { shake.stirFrames++; shake.liveLabel = 'stir'; }
        else if (ratio < cfg.circ - 0.08) { shake.strainFrames++; shake.liveLabel = 'strain'; }
      }
      if (meanHm < cfg.shake * 0.55) {
        if (shake.lowSince === null) shake.lowSince = t;
        if (t - shake.lowSince > 0.25) {
          var dur = t - shake.startT;
          shake.active = false; shake.candSince = null;
          if (dur >= 0.45 && (shake.stirFrames + shake.strainFrames) > 6) {
            var kind = shake.stirFrames >= shake.strainFrames ? 'stir' : 'strain';
            hit(kind, dur.toFixed(1) + 's, 원형성 ' + (ratio === null ? '-' : ratio.toFixed(2)) +
              ' (볶' + shake.stirFrames + ':거' + shake.strainFrames + ')');
          } else {
            log('흔들기 종료 — 너무 짧아 무시 (' + dur.toFixed(1) + 's)');
          }
        }
      } else {
        shake.lowSince = null;
      }
    }

    // --- 임펄스 (뒤집기/칼질): 수직 우세 스파이크, 흔들기 중에는 억제 ---
    if (!shake.active && t >= warmupUntil && t > refractoryUntil &&
        Math.abs(v) > cfg.imp && Math.abs(v) > 1.2 * hm) {
      if (v > 0) { refractoryUntil = t + 0.65; hit('flip', '+' + v.toFixed(1) + ' m/s²'); }
      else { refractoryUntil = t + 0.35; hit('chop', v.toFixed(1) + ' m/s²'); }
    }

    latest.v = v; latest.hm = meanHm; latest.ratio = ratio;

    if (recording && recBuf.length < 6000) {
      recBuf.push([+t.toFixed(3), +ax.toFixed(2), +ay.toFixed(2), +az.toFixed(2),
                   +gx.toFixed(2), +gy.toFixed(2), +gz.toFixed(2),
                   rr ? +(rr.alpha || 0).toFixed(1) : 0, rr ? +(rr.beta || 0).toFixed(1) : 0, rr ? +(rr.gamma || 0).toFixed(1) : 0]);
    }

    if (t - lastUiT > 0.05) { lastUiT = t; updateMeters(); }
    updateLiveTiles();
  }

  // ---------- 감지 결과 표시 ----------
  var names = { stir: '볶기 🍳', flip: '뒤집기 🥞', strain: '체거르기 🍜', chop: '칼질 🔪' };
  function hit(kind, detail) {
    counts[kind]++;
    var tile = $('t_' + kind);
    tile.querySelector('.ct').textContent = counts[kind];
    tile.classList.add('hit');
    setTimeout(function () { tile.classList.remove('hit'); }, 350);
    var b = $('stateBanner');
    b.textContent = names[kind] + '!';
    b.classList.add('flash');
    setTimeout(function () { b.classList.remove('flash'); if (!shake.active) b.textContent = '대기 중'; }, 500);
    if (navigator.vibrate) navigator.vibrate(30);
    log('감지: ' + names[kind] + ' — ' + detail);
    if (recording) recEvents.push({ t: +(performance.now() / 1000).toFixed(3), kind: kind, detail: detail });
  }

  function updateLiveTiles() {
    var b = $('stateBanner');
    $('t_stir').classList.toggle('live', shake.active && shake.liveLabel === 'stir');
    $('t_strain').classList.toggle('live', shake.active && shake.liveLabel === 'strain');
    if (shake.active) {
      b.classList.add('shaking');
      b.textContent = shake.liveLabel === 'stir' ? '볶는 중… 🍳'
                    : shake.liveLabel === 'strain' ? '거르는 중… 🍜' : '흔들기 판별 중…';
    } else {
      b.classList.remove('shaking');
      if (!b.classList.contains('flash') && b.textContent.indexOf('중…') > 0) b.textContent = '대기 중';
    }
  }

  function updateMeters() {
    var vf = $('vBar').querySelector('.fill');
    var vv = Math.max(-20, Math.min(20, latest.v));
    if (vv >= 0) { vf.style.left = '50%'; vf.style.width = (vv / 20 * 50) + '%'; }
    else { vf.style.width = (-vv / 20 * 50) + '%'; vf.style.left = (50 + vv / 20 * 50) + '%'; }
    $('vVal').textContent = latest.v.toFixed(1);
    $('hBar').querySelector('.fill').style.width = Math.min(100, latest.hm / 15 * 100) + '%';
    $('hVal').textContent = latest.hm.toFixed(1);
    $('cBar').querySelector('.fill').style.width = (latest.ratio === null ? 0 : latest.ratio * 100) + '%';
    $('cVal').textContent = latest.ratio === null ? '-' : latest.ratio.toFixed(2);
    $('chipHz').textContent = hz + ' Hz';
  }

  // ---------- 센서 연결 ----------
  var started = false;
  function onMotion(e) {
    var t = performance.now() / 1000;
    evCount++;
    if (t - evWindowStart >= 1) { hz = evCount; evCount = 0; evWindowStart = t; }

    var g = e.accelerationIncludingGravity;
    if (!g || g.x === null) return;
    var a = e.acceleration;
    var ax, ay, az;
    if (a && a.x !== null) { ax = a.x; ay = a.y; az = a.z; }
    else {
      // 자이로 없는 기기: includingGravity - 저역통과 중력으로 근사
      if (!gLP) { ax = 0; ay = 0; az = 0; }
      else {
        var s2 = cfg.invert ? -1 : 1; // gLP는 부호 정규화 후 저장되므로 되돌려 비교
        ax = g.x - gLP.x * s2; ay = g.y - gLP.y * s2; az = g.z - gLP.z * s2;
      }
    }
    processSample(t, ax, ay, az, g.x, g.y, g.z, e.rotationRate);
  }

  $('startBtn').addEventListener('click', function () {
    if (started) return;
    log('secure context: ' + window.isSecureContext + ' / UA: ' + navigator.userAgent.slice(0, 80));
    var DME = window.DeviceMotionEvent;
    if (!DME) { log('❌ DeviceMotionEvent 미지원'); $('chipPerm').textContent = '권한: 미지원'; return; }
    if (typeof DME.requestPermission === 'function') {
      log('requestPermission() 호출 → 팝업이 떠야 정상 (토스 WebView go/no-go 포인트!)');
      DME.requestPermission().then(function (r) {
        log('requestPermission 결과: ' + r);
        $('chipPerm').textContent = '권한: ' + r;
        $('chipPerm').className = 'chip ' + (r === 'granted' ? 'ok' : 'bad');
        if (r === 'granted') attach();
      }).catch(function (err) {
        log('❌ requestPermission 에러: ' + err);
        $('chipPerm').textContent = '권한: 에러';
        $('chipPerm').className = 'chip bad';
      });
    } else {
      log('requestPermission 불필요 (비iOS) — 바로 연결');
      $('chipPerm').textContent = '권한: 불필요';
      $('chipPerm').className = 'chip ok';
      attach();
    }
  });

  function attach() {
    started = true;
    evWindowStart = performance.now() / 1000;
    window.addEventListener('devicemotion', onMotion);
    $('startBtn').textContent = '✓ 센서 연결됨';
    $('startBtn').disabled = true;
    setTimeout(function () {
      if (hz === 0 && evCount === 0) log('⚠️ 1.5초간 센서 이벤트 없음 — HTTPS 여부/기기 지원 확인 필요');
    }, 1500);
    log('devicemotion 리스너 등록 완료');
  }

  // ---------- 튜닝 슬라이더 ----------
  function bindSlider(id, key, out) {
    $(id).addEventListener('input', function () {
      cfg[key] = parseFloat(this.value);
      $(out).textContent = this.value;
    });
  }
  bindSlider('sImp', 'imp', 'svImp');
  bindSlider('sShake', 'shake', 'svShake');
  bindSlider('sCirc', 'circ', 'svCirc');
  $('sInvert').addEventListener('change', function () {
    cfg.invert = this.checked;
    $('svInvert').textContent = '';
    gLP = null; // 부호 바뀌면 중력 필터 리셋
    log('축 반전: ' + cfg.invert);
  });

  // ---------- 기록/복사 ----------
  $('recBtn').addEventListener('click', function () {
    recording = !recording;
    if (recording) { recBuf = []; recEvents = []; this.textContent = '⏹ 기록 정지'; this.classList.add('rec'); log('기록 시작'); }
    else { this.textContent = '⏺ 기록 시작'; this.classList.remove('rec'); log('기록 정지 — 샘플 ' + recBuf.length + '개'); }
  });
  $('copyBtn').addEventListener('click', function () {
    var payload = JSON.stringify({
      meta: { ua: navigator.userAgent, ios: isIOS, invert: cfg.invert, hz: hz, secure: window.isSecureContext },
      thresholds: { imp: cfg.imp, shake: cfg.shake, circ: cfg.circ },
      counts: counts,
      columns: ['t', 'ax', 'ay', 'az', 'gx', 'gy', 'gz', 'rrA', 'rrB', 'rrG'],
      samples: recBuf, events: recEvents
    });
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(payload).then(
        function () { log('클립보드 복사 완료 (' + payload.length + '자)'); },
        function () { showFallback(payload); });
    } else showFallback(payload);
    function showFallback(txt) {
      var f = $('copyFallback');
      f.style.display = 'block'; f.value = txt; f.select();
      log('클립보드 API 실패 — 아래 텍스트를 길게 눌러 복사하세요');
    }
  });

  // ---------- 시뮬레이션 (?sim) ----------
  if (location.search.indexOf('sim') >= 0) {
    $('simPanel').style.display = 'block';
    var simTimer = null;
    var LEAD = 0.5; // 패턴 앞 정지 구간(중력 필터 안정화, 실사용의 '가만히 들고 있기'에 해당)
    function runSim(genRaw, durRaw) {
      // 앞: 정지(중력 안정화) / 뒤: 정지 tail(상태 머신이 자연스럽게 닫히도록 — 실폰은 정지 시에도 이벤트가 계속 옴)
      var gen = function (el) {
        var el2 = el - LEAD;
        if (el2 < 0 || el2 > durRaw) return { x: 0, y: 0, z: 0 };
        return genRaw(el2);
      };
      var dur = durRaw + LEAD + 1.2;
      if (simTimer) clearInterval(simTimer);
      // 가상 시계 기반: 백그라운드 탭에서 타이머가 스로틀링돼도 60Hz 샘플을 따라잡아 배치 처리
      var wall0 = performance.now() / 1000;
      var simEl = 0, STEP = 1 / 60;
      var G = cfg.invert ? -9.81 : 9.81; // processSample이 부호 정규화하므로 원시 관례로 주입
      var sgn = cfg.invert ? -1 : 1;
      var n = function () { return (Math.random() - 0.5) * 0.6; };
      simTimer = setInterval(function () {
        var wallEl = performance.now() / 1000 - wall0;
        var target = Math.min(wallEl, dur);
        while (simEl < target) {
          simEl += STEP;
          var a = gen(simEl);
          processSample(wall0 + simEl, sgn * (a.x + n()), sgn * (a.y + n()), sgn * (a.z + n()),
                        sgn * a.x + n(), sgn * a.y + n(), sgn * a.z + G + n(), null);
        }
        if (wallEl >= dur) { clearInterval(simTimer); simTimer = null; log('SIM 종료'); }
      }, 16);
    }
    var sims = {
      chop: function () {
        runSim(function (el) {
          var ph = el % 0.42;
          if (ph < 0.08) return { x: 0, y: 0, z: -13 };
          if (ph < 0.16) return { x: 0, y: 0, z: 7 };
          return { x: 0, y: 0, z: 0 };
        }, 1.15);
      },
      flip: function () {
        runSim(function (el) {
          if (el < 0.12) return { x: 0, y: 0, z: 14 };
          if (el < 0.24) return { x: 0, y: 0, z: -8 };
          return { x: 0, y: 0, z: 0 };
        }, 0.5);
      },
      strain: function () {
        runSim(function (el) {
          return { x: 8 * Math.sin(2 * Math.PI * 4.5 * el), y: 0, z: 0 };
        }, 1.7);
      },
      stir: function () {
        runSim(function (el) {
          return { x: 6 * Math.cos(2 * Math.PI * 2.2 * el), y: 6 * Math.sin(2 * Math.PI * 2.2 * el), z: 0 };
        }, 1.7);
      }
    };
    document.querySelectorAll('#simPanel button').forEach(function (btn) {
      btn.addEventListener('click', function () { log('SIM: ' + btn.dataset.sim); sims[btn.dataset.sim](); });
    });
    log('시뮬레이션 모드 활성 (합성 신호로 감지 로직 검증)');
  }

  log('페이지 로드 완료 — 센서 시작을 눌러주세요');
})();
</script>
</body>
